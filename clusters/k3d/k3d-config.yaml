apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev
servers: 1
agents: 2
image: rancher/k3s:v1.35.5-k3s1
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

volumes:
  - volume: ${HOME}/.local/share/mantooth-tasks/dev:/var/lib/mantooth-tasks/dev
    nodeFilters:
      - all
  - volume: ${HOME}/.local/share/mantooth-tasks/prod:/var/lib/mantooth-tasks/prod
    nodeFilters:
      - all
